<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Student Profile Card</h1>
    <div class="profile-card">
        <img src="image.png" alt="Student Photo" class="profile-photo">
        <h2 class="student-name">Name :  John Doe</h2>
        <p class="student-info">Branch : Computer Science Major, Class of 2027</p>
        <p class="student-info">Email: <strong>john.doe@example.com</strong></p>
    </div>

</body>
</html>
